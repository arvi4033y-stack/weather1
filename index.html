<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="weather-card">
    <h1>🌤️ aravind</h1>
    <p>Check the weather in any city</p>
    <form id="weatherForm">
      <input type="text" id="cityInput" placeholder="Enter city name" required>
      <button type="submit">Search</button>
    </form>
    <p id="message">Enter a city to see its weather.</p>
    <div id="weatherInfo" class="hidden">
      <h2 id="cityName"></h2>
      <div id="weatherIcon">🌤️</div>
      <h1 id="temperature"></h1>
      <h3 id="condition"></h3>
      <div class="details">
        <div><span>💧 Humidity</span><strong id="humidity"></strong></div>
        <div><span>💨 Wind Speed</span><strong id="wind"></strong></div>
        <div><span>🌡️ Feels Like</span><strong id="feelsLike"></strong></div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
